services:
  - type: web
    name: deyvit-direct-downloads
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev && mkdir -p bin && curl -fL --retry 3 https://github.com/yt-dlp/yt-dlp/releases/download/2026.10.21/yt-dlp_linux -o bin/yt-dlp && echo 'd8bd33fca9d5b23bd5b9952b3fca36db5c46331933fda9f598a3da14ce2c243f  bin/yt-dlp' | sha256sum -c - && chmod +x bin/yt-dlp
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.14.0

