services:
  - type: web
    name: deyvit-direct-downloads
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev && mkdir -p bin && curl -fL --retry 3 https://github.com/yt-dlp/yt-dlp/releases/download/2026.10.26/yt-dlp_linux -o bin/yt-dlp && echo '767ba9dce7052aa196f8b12652f433d76de128ba168966fa84b6394d5e6c6795  bin/yt-dlp' | sha256sum -c - && chmod +x bin/yt-dlp
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.14.0

